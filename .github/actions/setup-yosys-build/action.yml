name: Setup Yosys source build
description: Native compilers and CMake prerequisites for the pinned Yosys submodule
runs:
  using: composite
  steps:
    - name: Setup Linux Python
      if: runner.os == 'Linux'
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install Linux build dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-12 g++-12 ninja-build bison flex pkg-config
        python -m pip install cmake==3.31.6
        echo 'CC=gcc-12' >> "$GITHUB_ENV"
        echo 'CXX=g++-12' >> "$GITHUB_ENV"

    - name: Install macOS build dependencies
      if: runner.os == 'macOS'
      shell: bash
      run: |
        brew install cmake ninja bison flex
        echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
        echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
        echo 'CC=/usr/bin/clang' >> "$GITHUB_ENV"
        echo 'CXX=/usr/bin/clang++' >> "$GITHUB_ENV"

    - name: Install Windows build dependencies
      if: runner.os == 'Windows'
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        update: true
        install: >-
          bison flex
          mingw-w64-clang-x86_64-clang
          mingw-w64-clang-x86_64-libc++
          mingw-w64-clang-x86_64-cmake
          mingw-w64-clang-x86_64-ninja
          mingw-w64-clang-x86_64-python
          mingw-w64-clang-x86_64-pkgconf

    - name: Configure native Windows tool paths
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        MSYS2_ROOT: ${{ steps.msys2.outputs.msys2-location }}
      run: |
        "$env:MSYS2_ROOT\usr\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
        "$env:MSYS2_ROOT\clang64\bin" | Out-File -Append -FilePath $env:GITHUB_PATH
        "CC=$env:MSYS2_ROOT\clang64\bin\clang.exe" | Out-File -Append -FilePath $env:GITHUB_ENV
        "CXX=$env:MSYS2_ROOT\clang64\bin\clang++.exe" | Out-File -Append -FilePath $env:GITHUB_ENV
